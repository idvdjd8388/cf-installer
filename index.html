<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>CF Installer v4.7.0</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--bg2:#0a0a0a;--bg3:#111;--bg4:#1a1a1a;--bg5:#222;--text:#f0f0f5;--text2:#999;--text3:#666;--text4:#555;--blue:#3b82f6;--blue2:#2563eb;--blue3:#60a5fa;--pink:#ec4899;--pink2:#db2777;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--cyan:#06b6d4;--yellow:#eab308;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.05);--border3:rgba(255,255,255,.15);--radius:12px;--radius2:16px;--radius3:20px;--shadow:0 20px 60px rgba(0,0,0,.4);--shadow-lg:0 8px 32px rgba(0,0,0,.5);--font:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;--glow:0 0 30px rgba(59,130,246,.15)}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* Scrollbar */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.15)}

/* Background effects */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;height:600px;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(0,229,160,.06),rgba(0,184,255,.03),transparent);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:0;left:0;right:0;height:400px;
  background:radial-gradient(ellipse 80% 50% at 50% 120%,rgba(0,184,255,.04),transparent);
  pointer-events:none;z-index:0;
}

.container{max-width:520px;margin:0 auto;padding:20px 14px 80px;position:relative;z-index:1}

/* ===== HEADER ===== */
.header{text-align:center;padding:80px 0 40px}
.logo{font-size:2.2rem;font-weight:900;letter-spacing:-.04em;background:linear-gradient(135deg,#fff,var(--blue3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.logo-sub{font-size:.88rem;color:var(--text2);line-height:1.7}
.logo-ver{display:inline-block;padding:4px 12px;border-radius:9999px;background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(236,72,153,.08));border:1px solid rgba(59,130,246,.15);color:var(--blue3);font-size:.72rem;font-weight:700;margin-top:12px}

/* ===== CARDS ===== */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius3);padding:28px;margin-bottom:16px;position:relative;transition:all .4s cubic-bezier(.16,1,.3,1);animation:cardIn .6s cubic-bezier(.16,1,.3,1) both}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card-title{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:1.2rem}
.card-subtitle{font-size:.8rem;color:var(--text3);margin-bottom:16px;line-height:1.5}

/* ===== FORM ELEMENTS ===== */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.72rem;font-weight:700;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.form-input{width:100%;height:52px;background:var(--bg3);border:2px solid var(--border2);border-radius:var(--radius);padding:0 18px;color:var(--text);font-size:.84rem;font-family:var(--font);outline:none;transition:all .3s}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.form-input::placeholder{color:var(--text4)}
.form-hint{font-size:.7rem;color:var(--text4);margin-top:6px}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 28px;border:none;border-radius:var(--radius);font-size:.88rem;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .3s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 4px 20px rgba(59,130,246,.3)}
.btn-primary:hover{box-shadow:0 8px 32px rgba(59,130,246,.4);transform:translateY(-2px)}
.btn-secondary{background:transparent;color:var(--text2);border:2px solid var(--border)}
.btn-secondary:hover{background:var(--bg3);border-color:var(--border3)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626;transform:translateY(-1px)}
.btn-sm{height:38px;padding:0 16px;font-size:.76rem;border-radius:8px}
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn-test{background:transparent;color:var(--text2);border:2px solid var(--border);height:38px;padding:0 16px;font-size:.76rem;border-radius:8px}

/* ===== ALERTS ===== */
.alert{padding:12px 16px;border-radius:var(--radius);font-size:.8rem;font-weight:600;margin-top:12px}
.alert-info{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.15);color:var(--blue3)}
.alert-success{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15);color:var(--green)}
.alert-error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);color:var(--red)}
.alert-warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.15);color:var(--orange)}

/* ===== SPINNER ===== */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--text4);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-left:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== DEPLOY LOG ===== */
.deploy-log{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;font-family:var(--font-mono);font-size:.67rem;line-height:2.2;color:var(--text4);max-height:180px;overflow-y:auto;margin-top:12px}
.deploy-log::-webkit-scrollbar{width:3px}
.deploy-log::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}
.log-info{color:var(--blue3)}
.log-ok{color:var(--green)}
.log-err{color:var(--red)}

/* ===== PANEL GRID ===== */
.panel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.panel-card{padding:18px 8px 14px;border-radius:var(--radius2);background:var(--bg3);border:2px solid var(--border2);cursor:pointer;text-align:center;transition:all .4s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.panel-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(59,130,246,.04),transparent);opacity:0;transition:opacity .3s}
.panel-card:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(0,0,0,.4);border-color:var(--border3)}
.panel-card:hover::before{opacity:1}
.panel-card.selected{border-color:var(--blue);background:rgba(59,130,246,.06);box-shadow:0 0 24px rgba(59,130,246,.12),0 16px 40px rgba(0,0,0,.4)}
.panel-card.selected .panel-name{color:var(--blue3)}
.panel-card.selected::before{opacity:1}
.panel-icon-wrap{font-size:1.6rem;margin-bottom:8px;transition:transform .3s}
.panel-card:hover .panel-icon-wrap{transform:scale(1.2)}
.panel-name{font-size:.74rem;font-weight:700;color:var(--text2);transition:color .2s;margin-bottom:3px}
.panel-desc{font-size:.6rem;color:var(--text4);line-height:1.4}

/* ===== PANEL VAR INPUTS ===== */
.panel-vars{display:none;margin-top:14px;padding:16px;border-radius:var(--radius);background:var(--bg3);border:1px solid var(--border2)}
.panel-vars.show{display:block;animation:cardIn .4s ease both}

/* ===== RESULT BOXES ===== */
.result-box{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--radius);background:var(--bg3);border:1px solid var(--border2);margin-bottom:8px;animation:cardIn .4s ease both}
.result-label{font-size:.72rem;color:var(--text3);font-weight:600;flex-shrink:0}
.result-value{display:flex;align-items:center;gap:8px;flex:1;margin:0 10px;font-size:.78rem;font-weight:700;color:var(--blue3);word-break:break-all;direction:ltr;text-align:right}
.result-value a{color:var(--cyan);text-decoration:none}
.result-value a:hover{text-decoration:underline}
.copy-btn{padding:4px 10px;border-radius:6px;background:var(--bg4);border:1px solid var(--border);color:var(--text2);font-size:.65rem;font-weight:600;cursor:pointer;transition:all .2s;flex-shrink:0}
.copy-btn:hover{background:var(--bg5);color:var(--text)}
.copy-btn.copied{background:rgba(34,197,94,.1);color:var(--green);border-color:rgba(34,197,94,.2)}

.divider{
  border:none;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border2),transparent);
  margin:24px 0;
}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(120px);
  background:rgba(18,18,26,.9);
  backdrop-filter:blur(20px);
  border:1px solid var(--border2);
  border-radius:14px;
  padding:14px 24px;
  font-size:.85rem;
  font-weight:500;
  color:var(--text);
  z-index:100;
  opacity:0;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

/* ===== FOOTER ===== */
.footer{
  text-align:center;
  padding:40px 0 20px;
  width:100%;
  max-width:680px;
  position:relative;
  z-index:1;
}
.footer-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border2),transparent);
  margin:0 0 24px;
}
.footer-title{
  font-size:.82rem;
  font-weight:600;
  color:var(--text2);
  margin-bottom:16px;
  letter-spacing:.3px;
}
.footer-stars{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px 16px;
}
.footer-star{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:.78rem;
  color:var(--text3);
  font-weight:500;
  padding:4px 10px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-radius:8px;
  transition:all .3s;
}
.footer-star:hover{
  border-color:var(--border2);
  color:var(--text2);
  background:rgba(255,255,255,.04);
}
.footer-star .star-icon{color:var(--yellow);font-size:.85rem}
.footer-copy{
  margin-top:16px;
  font-size:.72rem;
  color:var(--text3);
  opacity:.6;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

/* ===== RESPONSIVE ===== */
@media(max-width:640px){
  html{font-size:14px}
  .container{padding:0 16px}
  .header{padding:36px 0 28px}
  .logo{font-size:2rem;letter-spacing:4px}
  .card{padding:24px;border-radius:16px}
  .panel-grid{grid-template-columns:1fr;gap:12px}
  .panel-card{padding:18px 14px}
  .btn-group{flex-direction:column}
  .btn-group .btn{width:100%}
  .result-value{flex-direction:column;align-items:flex-start;gap:8px}
  .copy-btn{align-self:flex-end}
  .footer-stars{gap:6px 10px}
}
/* Progress bar */
.progress-bar-wrap{margin-bottom:14px}
.progress-track{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--pink));width:0%;transition:width 1s cubic-bezier(.16,1,.3,1);box-shadow:0 0 12px rgba(59,130,246,.3)}
.progress-pct{position:absolute;top:-20px;left:0;font-size:.72rem;font-weight:700;color:var(--blue3)}
.progress-label{font-size:.78rem;color:var(--text2);font-weight:600;margin-top:8px}
.progress-step{display:flex;justify-content:space-between;margin-bottom:12px}
.progress-step .step-circle{width:28px;height:28px;border-radius:50%;background:var(--bg4);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700}
.progress-step .active .step-circle{background:rgba(59,130,246,.12);border-color:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.2)}
.progress-step .done .step-circle{background:rgba(34,197,94,.1);border-color:var(--green)}

/* Panel badges */
.panel-badges{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.proto-badge{padding:2px 8px;border-radius:9999px;font-size:.55rem;font-weight:700;border:1px solid var(--border2);color:var(--text3)}
.proto-vless{border-color:rgba(59,130,246,.2);color:var(--blue3);background:rgba(59,130,246,.06)}
.proto-trojan{border-color:rgba(236,72,153,.2);color:var(--pink);background:rgba(236,72,153,.06)}
.proto-domain{border-color:rgba(6,182,212,.2);color:var(--cyan);background:rgba(6,182,212,.06)}
.proto-sub{border-color:rgba(34,197,94,.2);color:var(--green);background:rgba(34,197,94,.06)}

/* Tooltip */
.panel-card{position:relative}
.tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--bg4);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5;white-space:nowrap;opacity:0;visibility:hidden;transition:all .2s;z-index:100;pointer-events:none;max-width:250px;white-space:normal;text-align:center}
.tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--bg4)}
.panel-card:hover .tooltip,.panel-card:active .tooltip{opacity:1;visibility:visible}

/* ===== LIGHT THEME ===== */
[data-theme="light"]{
  --bg:#f5f6fa;--bg2:#ffffff;--bg3:#eef0f5;--bg4:#e2e5ed;
  --text:#1a1a2e;--text2:#555570;--text3:#8888a0;
  --cyan:#00b882;--cyan2:#0096d6;--cyan-bg:rgba(0,184,130,.1);
  --green:#00a854;--green-bg:rgba(0,168,84,.08);
  --red:#e53935;--red-bg:rgba(229,57,53,.08);
  --yellow:#d4910a;--yellow-bg:rgba(212,145,10,.08);
  --border:rgba(0,0,0,.06);--border2:rgba(0,0,0,.1);--border3:rgba(0,0,0,.15);
  --shadow:0 4px 24px rgba(0,0,0,.06);--shadow-lg:0 12px 48px rgba(0,0,0,.1);
  --glow:0 0 40px rgba(0,184,130,.04);
}
[data-theme="light"] body::before{background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(0,184,130,.05),rgba(0,150,214,.03),transparent)}
[data-theme="light"] body::after{background:radial-gradient(ellipse 80% 50% at 50% 120%,rgba(0,150,214,.03),transparent)}
[data-theme="light"] *{scrollbar-color:rgba(0,0,0,.12) transparent}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12)}
[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.2)}
[data-theme="light"] .card::before{background:linear-gradient(90deg,transparent,rgba(0,0,0,.04),transparent)}
[data-theme="light"] .form-input{background:rgba(0,0,0,.02);color:var(--text)}
[data-theme="light"] .form-input:focus{background:rgba(0,0,0,.03);box-shadow:0 0 0 3px rgba(0,184,130,.1),inset 0 1px 2px rgba(0,0,0,.05)}
[data-theme="light"] .btn-secondary{background:rgba(0,0,0,.03);color:var(--text);border-color:var(--border2)}
[data-theme="light"] .btn-secondary:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,184,130,.05)}
[data-theme="light"] .panel-card{background:rgba(0,0,0,.01)}
[data-theme="light"] .panel-card:hover{box-shadow:0 8px 32px rgba(0,0,0,.08)}
[data-theme="light"] .panel-icon-wrap{background:rgba(0,0,0,.03);border-color:var(--border)}
[data-theme="light"] .toast{background:rgba(255,255,255,.95);color:var(--text);border-color:var(--border2)}
[data-theme="light"] .deploy-log{background:rgba(0,0,0,.03);color:var(--text2)}
[data-theme="light"] .result-box{background:rgba(0,0,0,.01)}
[data-theme="light"] .result-box:hover{background:rgba(0,0,0,.02)}
[data-theme="light"] .copy-btn{background:rgba(0,0,0,.03);border-color:var(--border2);color:var(--text2)}
[data-theme="light"] .copy-btn:hover{color:var(--cyan);border-color:rgba(0,184,130,.3);background:rgba(0,184,130,.06)}
[data-theme="light"] .copy-btn.copied{color:var(--green);border-color:rgba(0,168,84,.3);background:rgba(0,168,84,.06)}
[data-theme="light"] .alert-info{background:rgba(0,184,130,.06);border-color:rgba(0,184,130,.1);color:#008060}
[data-theme="light"] .alert-success{background:rgba(0,168,84,.05);border-color:rgba(0,168,84,.1);color:#007040}
[data-theme="light"] .alert-error{background:rgba(229,57,53,.05);border-color:rgba(229,57,53,.1);color:#c62828}
[data-theme="light"] .alert-warn{background:rgba(212,145,10,.05);border-color:rgba(212,145,10,.1);color:#a06800}
[data-theme="light"] .tooltip{background:var(--bg3);color:var(--text);border-color:var(--border2)}
[data-theme="light"] .tooltip::after{border-top-color:var(--bg3)}
[data-theme="light"] .footer-star{background:rgba(0,0,0,.02);border-color:var(--border)}
[data-theme="light"] .logo-ver{background:rgba(0,0,0,.03);border-color:var(--border)}
[data-theme="light"] .progress-step .step-circle{background:var(--bg3);border-color:var(--border2)}
[data-theme="light"] .progress-track{background:var(--bg3);border-color:var(--border2)}
[data-theme="light"] .progress-pct{color:var(--text);text-shadow:none}
[data-theme="light"] .divider{background:linear-gradient(90deg,transparent,rgba(0,0,0,.08),transparent)}

/* Theme Toggle */
.theme-toggle{
  position:fixed;top:16px;left:16px;width:44px;height:44px;
  border-radius:50%;background:var(--bg2);border:1px solid var(--border2);
  cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;
  z-index:50;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow);
}
.theme-toggle:hover{transform:scale(1.1);box-shadow:var(--shadow-lg);border-color:var(--cyan)}

/* Connection Test */
.test-result{display:none;padding:16px;border-radius:var(--radius);text-align:center;font-weight:700;font-size:.88rem;margin-top:14px}
.test-result.show{display:block;animation:popIn .4s cubic-bezier(.175,.885,.32,1.275) both}
.test-result.testing{background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.test-result.active{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:var(--green)}
.test-result.inactive{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red)}
.test-result.error{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.15);color:var(--orange)}
.test-time{display:block;font-size:.7rem;font-weight:500;opacity:.6;margin-top:4px}
.speed-result{
  display:none;align-items:center;gap:10px;
  padding:14px 18px;border-radius:12px;margin-top:12px;
  font-size:.9rem;font-weight:600;
  border:1px solid var(--border);background:var(--bg2);
}
[data-theme="light"] .test-result.testing{background:rgba(0,150,214,.05);border-color:rgba(0,150,214,.1);color:#0070a0}
[data-theme="light"] .test-result.active{background:rgba(0,168,84,.05);border-color:rgba(0,168,84,.1);color:#006030}
[data-theme="light"] .test-result.inactive{background:rgba(229,57,53,.05);border-color:rgba(229,57,53,.1);color:#b71c1c}
[data-theme="light"] .test-result.error{background:rgba(212,145,10,.05);border-color:rgba(212,145,10,.1);color:#8a5c00}
[data-theme="light"] .btn-test{background:rgba(0,0,0,.03);color:var(--text);border-color:var(--border2)}
[data-theme="light"] .btn-test:hover{border-color:var(--cyan2);color:var(--cyan2);background:rgba(0,150,214,.05)}

/* Delete Button */
.btn-danger{
  background:rgba(255,68,102,.1);color:var(--red);border:1px solid rgba(255,68,102,.2);
}

function cpB(b,t){navigator.clipboard.writeText(t).then(()=>{const o=b.textContent;b.textContent='کپی شد!';b.classList.add('copied');setTimeout(()=>{b.textContent=o;b.classList.remove('copied')},1500)})}

        <hr class="divider">

        <div id="edgtunPaths" style="display:none">
          <div class="result-box"><div class="result-label">🌐 VLESS کانفیگ</div><div class="result-value"><a id="edVless" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyEdVless">کپی</button></div></div>
          <div class="result-box"><div class="result-label">🔗 VLESS لینک مستقیم</div><div class="result-value"><a id="edVlessLink" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyEdVlessLink">کپی</button></div></div>

        </div>
        <div id="foxPaths" style="display:none">

        </div>
        <div id="amcfPaths" style="display:none">
          <div class="result-box"><div class="result-label">🔐 صفحه لاگین</div><div class="result-value"><a id="amcfRoot" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyAmcfRoot">کپی</button></div></div>
          <div class="result-box"><div class="result-label">📑 صفحه اشتراک</div><div class="result-value"><a id="amcfSub" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyAmcfSub">کپی</button></div></div>

        <div id="v2rayPaths" style="display:none">

          <div class="result-box"><div class="result-label">📑 صفحه اشتراک</div><div class="result-value"><a id="v2raySub" href="#" target="_blank" style="color:var(--cyan);text-decoration:none;word-break:break-all;font-size:13px"></a><button class="copy-btn" id="copyV2raySub">کپی</button></div></div>

        <div class="btn-group"><button class="btn btn-secondary btn-sm" id="testBtn" onclick="testConnection()">📊 تست اتصال</button><button class="btn btn-secondary btn-sm" onclick="speedTest()" id="speedBtn">⚡ تست سرعت</button><a id="openPanel" href="#" target="_blank" class="btn btn-primary">باز کردن پنل</a><button class="btn btn-secondary" id="updateBtn">🔄 بروزرسانی</button><button class="btn btn-danger" id="deleteBtn">🗑️ حذف Worker</button><button class="btn btn-secondary" onclick="render()">نصب جدید</button></div>
        <div class="test-result" id="testResult"></div>

  `;

  // Render panel cards

  // Panel selection
  pg.querySelectorAll('.panel-card').forEach(c=>c.addEventListener('click',()=>{

    $('deployBtn').disabled=false;
    updatePanelVars(selectedPanel);
  }));

  // Validate
  $('validateBtn').addEventListener('click',async()=>{
    const token=$('tokenIn').value.trim();

    $('validateBtn').textContent='⏳ در حال بررسی...';$('validateBtn').disabled=true;
    if(!token.startsWith('cfut_')){$('tokenResult').innerHTML='<div class="alert alert-error" style="margin-top:12px">❌ فرمت توکن نامعتبر است. توکن باید با cfut_ شروع شود</div>';$('validateBtn').textContent='🔍 بررسی توکن';$('validateBtn').disabled=false;return}
    try{
      const r=await fetch(BACKEND+'/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,panelType:'validate'})});
      const d=await r.json();
      if(d.success){
        $('tokenResult').innerHTML='<div class="alert alert-success" style="margin-top:12px">✅ توکن معتبر است!</div>';

        try{

  // Deploy

    // Gather panel-specific vars

        const inp=$('var_'+k);

        else vars[k]=v;

    }

    const payload={token,panelType:selectedPanel,vars};

    try{

            if(l.includes('استقرار Worker'))setProgress(80,'استقرار Worker...');

            i++;
            setTimeout(showNextLog,400);

        };
        showNextLog();

        $('resUrlInput').value=d.panelURL;
        $('resName').textContent=d.workerName;
        $('resPath').textContent=d.panelPath||'/';
        $('openPanel').href=d.panelURL;
        // Also update openPanel when input changes
        $('resUrlInput').addEventListener('input',function(){$('openPanel').href=this.value})
        $('resultBox').style.display='block';
        // Dashboard link
        if(d.dashboardURL){
          var old=document.getElementById('dashLink');if(old)old.remove();

          const uuid=d.uuid;
          const host=new URL(base).host;
          const foxRoot=base;

          const foxVless='vless://'+uuid+'@'+host+':443?encryption=none&security=tls&sni='+host+'&fp=chrome&type=ws&host='+host+'&path=/ws#CF-Worker';
          $('foxRoot').textContent=foxRoot;$('foxRoot').href=foxRoot;
          $('foxSub').textContent=foxSub;$('foxSub').href=foxSub;
          $('foxVless').textContent=foxVless;$('foxVless').href=foxVless;
          $('copyFoxRoot').addEventListener('click',function(){cpB(this,foxRoot)});
          $('copyFoxSub').addEventListener('click',function(){cpB(this,foxSub)});
          $('copyFoxVless').addEventListener('click',function(){cpB(this,foxVless)});
        }

        // am-cf-tunnel paths
        if(d.panelType==='amcf' && d.uuid){
          $('amcfPaths').style.display='block';
          const base=d.panelURL;
          const uuid=d.uuid;
          const host=new URL(base).host;
          const amcfRoot=base;
          const amcfSub=base+'/sub';
          const amcfVless='vless://'+uuid+'@'+host+':443?encryption=none&type=ws#CF-Worker';
          $('amcfRoot').textContent=amcfRoot;$('amcfRoot').href=amcfRoot;
          $('amcfSub').textContent=amcfSub;$('amcfSub').href=amcfSub;
          $('amcfVless').textContent=amcfVless;$('amcfVless').href=amcfVless;
          $('amcfUuid').textContent=uuid;
          $('copyAmcfRoot').addEventListener('click',function(){cpB(this,amcfRoot)});
          $('copyAmcfSub').addEventListener('click',function(){cpB(this,amcfSub)});
          $('copyAmcfVless').addEventListener('click',function(){cpB(this,amcfVless)});
          $('copyAmcfUuid').addEventListener('click',function(){cpB(this,uuid)});
        }

        // ZQ-VTPanel paths
        if(d.panelType==='vtpanel'){
          $('vtpanelPaths').style.display='block';
          const base=d.panelURL;
          $('vtpRoot').textContent=base;$('vtpRoot').href=base;
          $('copyVtpRoot').addEventListener('click',function(){cpB(this,base)});
        }

        // v2ray-worker paths
        if(d.panelType==='v2ray'){
          $('v2rayPaths').style.display='block';
          const base=d.panelURL;
          const adminUrl=base;
          const subUrl=base+'/s/subscribe';
          $('v2rayAdmin').textContent=adminUrl;$('v2rayAdmin').href=adminUrl;
          $('v2raySub').textContent=subUrl;$('v2raySub').href=subUrl;
          $('copyV2rayAdmin').addEventListener('click',function(){cpB(this,adminUrl)});

        $('copyUrl').addEventListener('click',function(){cpB(this,$('resUrlInput').value)});

        $('copyPath').addEventListener('click',function(){cpB(this,d.panelPath||'/')});
        toast('✅ نصب کامل شد!');

        deployState.token=token;

        deployState.panelType=d.panelType;
        deployState.panelURL=d.panelURL;
        deployState.panelPath=d.panelPath;
        deployState.uuid=d.uuid||null;
      } else {
        $('deployLog').innerHTML+=`<br><span class="log-err">❌ ${esc(d.error||'خطا')}</span>`;

      $('deployLog').innerHTML+=`<br><span class="log-err">❌ خطا: ${esc(e.message)}</span>`;
      toast('❌ خطا: '+e.message);
    }
    $('deployBtn').disabled=false;$('deployBtn').textContent='🚀 نصب و فعال‌سازی';
  });

}

// Show variable inputs for panels that need them
function updatePanelVars(panel){
  const pv=$('panelVars');
  if(!pv){return}
  const cfg=PANELS_CONFIG[panel];
  if(!cfg||!cfg.vars||Object.keys(cfg.vars).length===0){
    pv.classList.remove('show');
    pv.innerHTML='';
    return;
  }
  let html='';
  Object.entries(cfg.vars).forEach(([k,v])=>{
    const label=k==='uid'?'UUID (شناسه یکتای کاربر)':k==='Pswd'?'رمز Trojan':'مقدار '+k;
    const placeholder=k==='uid'?'مثلاً: 12345678-1234-1234-1234-123456789abc':k==='Pswd'?'پیش‌فرض: trojan':v;
    html+=`<div class="form-group" style="margin-bottom:16px"><label class="form-label">${label}</label><input type="text" class="form-input" id="var_${k}" value="${esc(v)}" placeholder="${placeholder}" style="direction:ltr;text-align:left"></div>`;
  });
  pv.innerHTML=html;
  pv.classList.add('show');
}


// Delete Worker
async function deleteWorker(){
  if(!deployState.workerName||!deployState.token){toast('⚠️ ابتدا یک Worker نصب کنید');return}
  if(!confirm('⚠️ آیا مطمئن هستید که می\u200cخواهید Worker "\u200f'+deployState.workerName+'\u200f" را حذف کنید?\n\nاین عمل قابل بازگشت نیست!'))return;
  toast('⏳ در حال حذف...');
  try{
    const r=await fetch(BACKEND+'/cf',{method:'POST',headers:{'Authorization':'Bearer '+deployState.token,'Content-Type':'application/json','X-CF-Path':'/accounts/'+deployState.accountId+'/workers/scripts/'+deployState.workerName,'X-CF-Method':'DELETE'}});
    const d=await r.json();
    if(d.success){
      toast('✅ Worker حذف شد!');
      deployState={token:'',accountId:deployState.accountId,workerName:'',panelType:'',panelURL:'',panelPath:'',uuid:null};
      render();
    }else{
      toast('❌ خطا: '+(d.errors?.[0]?.message||'حذف ناموفق'));
    }
  }catch(e){toast('❌ خطا: '+e.message)}
}

// Update Worker
async function updateWorker(){
  if(!deployState.workerName||!deployState.token){toast('⚠️ ابتدا یک Worker نصب کنید');return}
  if(!confirm('🔄 آیا مطمئن هستید که می\u200cخواهید Worker را بروزرسانی کنید?\n\nکد جدید دانلود و Worker آپدیت می\u200cشود.'))return;
  const repoCfg=DEPLOY_REPOS[deployState.panelType];
  if(!repoCfg){toast('❌ پنل ناشناخته');return}
  const dc=$('deployCard'),dl=$('deployLog'),rb=$('resultBox');
  dc.style.display='block';rb.style.display='none';
  dl.innerHTML='<span class="log-info">▸ شروع بروزرسانی...</span>';setProgress(0,'شروع بروزرسانی...');
  try{
    // Step 1: Download new source
    dl.innerHTML+='<br><span class="log-info">▸ دانلود کد جدید...</span>';setProgress(40,'دانلود کد جدید...');
    const branch=repoCfg.release||'main';
    const srcUrl='https://raw.githubusercontent.com/'+repoCfg.repo+'/'+branch+'/'+repoCfg.file;
    const srcR=await fetch(BACKEND+'/github',{method:'POST',headers:{'Content-Type':'application/json','X-GitHub-Url':srcUrl}});
    const srcText=await srcR.text();
    if(!srcR.ok||srcText.includes('Not Found')||srcText.includes('404'))throw new Error('کد منبع یافت نشد');
    dl.innerHTML+='<br><span class="log-ok">✅ کد دانلود شد: '+(srcText.length/1024).toFixed(0)+'KB</span>';
    // Step 2: Get current worker metadata
    dl.innerHTML+='<br><span class="log-info">▸ دریافت متادیتای فعلی...</span>';
    const metaR=await fetch(BACKEND+'/cf',{method:'POST',headers:{'Authorization':'Bearer '+deployState.token,'Content-Type':'application/json','X-CF-Path':'/accounts/'+deployState.accountId+'/workers/scripts/'+deployState.workerName,'X-CF-Method':'GET'}});
    const metaD=await metaR.json();
    let bindings=[];
    if(metaD.success&&metaD.result){
      bindings=metaD.result.bindings||[];
      dl.innerHTML+='<br><span class="log-ok">✅ متادیتا: '+bindings.length+' binding</span>';
    }else{
      throw new Error('خطا در دریافت متادیتا: '+(metaD.errors?.[0]?.message||'unknown'));
    }
    // Step 3: Upload new code with existing bindings
    dl.innerHTML+='<br><span class="log-info">▸ آپدیت Worker...</span>';setProgress(80,'آپدیت Worker...');
    const metadata={main_module:'worker.js',compatibility_date:'2024-09-22',compatibility_flags:['nodejs_compat'],bindings:bindings};
    const fd=new FormData();
    fd.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
    fd.append('worker.js',new Blob([srcText],{type:'application/javascript+module'}),'worker.js');
    const putR=await fetch(BACKEND+'/cf',{method:'POST',headers:{'Authorization':'Bearer '+deployState.token,'X-CF-Path':'/accounts/'+deployState.accountId+'/workers/scripts/'+deployState.workerName,'X-CF-Method':'PUT'},body:fd});
    const putD=await putR.json();
    if(!putD.success)throw new Error('خطا در آپدیت: '+(putD.errors?.[0]?.message||'unknown'));
    dl.innerHTML+='<br><span class="log-ok">✅ Worker بروزرسانی شد!</span>';
    toast('✅ بروزرسانی کامل شد!');
    rb.style.display='block';
  }catch(e){
    dl.innerHTML+='<br><span class="log-err">❌ خطا: '+esc(e.message)+'</span>';
    toast('❌ بروزرسانی ناموفق');
    rb.style.display='block';
  }
}

// Delete/Update event listeners (re-attach on each render)
function attachManageButtons(){
  const db=$('deleteBtn'),ub=$('updateBtn');

  if(ub)ub.addEventListener('click',updateWorker);

// Connection Test
function testConnection(){
  const url=$('resUrlInput')?.value||deployState.panelURL;
  if(!url){toast('⚠️ آدرس Worker موجود نیست');return}
  const el=$('testResult');
  if(!el)return;
  el.className='test-result show testing';
  el.innerHTML='<span class="spinner"></span> 🔄 در حال تست...';
  const t0=performance.now();
  fetch(url,{redirect:'follow'}).then(()=>{
    return fetch(url,{redirect:'follow'}).then(r=>{
      const ms=Math.round(performance.now()-t0);
      if(r.ok||r.status===302){
        el.className='test-result show active';
        el.innerHTML='🟢 Worker فعاله ✅<span class="test-time">'+ms+'ms</span>';
      }else{
        el.className='test-result show inactive';
        el.innerHTML='🔴 Worker غیرفعاله ❌<span class="test-time">HTTP '+esc(String(r.status))+'</span>';
      }
    });
  }).catch(()=>{
    const ms=Math.round(performance.now()-t0);
    if(ms<8000){
      el.className='test-result show active';
      el.innerHTML='🟢 Worker فعاله ✅<span class="test-time">'+ms+'ms</span>';
    }else{
      el.className='test-result show error';
      el.innerHTML='⚠️ خطا در اتصال<span class="test-time">'+ms+'ms</span>';
    }
  });
}

// Speed Test
async function speedTest(){
  const url=$('resUrlInput')?.value||deployState.panelURL;
  if(!url){toast('⚠️ آدرس Worker موجود نیست');return}
  const el=$('testResult');if(!el)return;
  el.className='test-result show testing';
  el.innerHTML='<span class="spinner"></span> ⚡ در حال تست سرعت...';

  const times=[];
  const rounds=5;

  for(let i=0;i<rounds;i++){
    try{
      const t0=performance.now();
      await fetch(url,{redirect:'follow',cache:'no-store'});
      const ms=Math.round(performance.now()-t0);
      times.push(ms);
    }catch(e){const ms=Math.round(performance.now()-t0);times.push(ms||9999)}
    await new Promise(r=>setTimeout(r,300));
  }

  const filtered=times;
  const avg=Math.round(filtered.reduce((a,b)=>a+b,0)/filtered.length);
  const min=Math.min(...filtered);
  const max=Math.max(...filtered);

  let score,emoji;
  if(avg<200){score='عالی ⭐⭐⭐';emoji='🚀'}
  else if(avg<500){score='خوب ⭐⭐';emoji='⚡'}
  else if(avg<1500){score='متوسط ⭐';emoji='🐌'}
  else{score='کند 💩';emoji='🐢'}

  el.className='test-result show active';
  el.innerHTML=emoji+' سرعت: '+avg+'ms ('+score+')<br><span class="test-time" style="font-size:12px;opacity:.7">min: '+min+'ms · max: '+max+'ms · '+rounds+' نمونه</span>';
}
