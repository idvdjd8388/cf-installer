worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;
  gzip_min_length 256;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

  server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html dashboard.html;

    # Frontend
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

    # API proxy to backend worker (v1)
    location /v1/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://wrangler-backend:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Origin $http_origin;
      proxy_set_header Referer $http_referer;
    }

    # Legacy redirect (kept for backward compat)
    location ~ ^/(deploy|list-workers|get-subdomain|cf|github)$ {
      return 308 /v1$request_uri;
    }

    # Health
    location = /health {
      proxy_pass http://wrangler-backend:8787;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.cloudflare.com https://api.telegram.org; img-src 'self' data:; frame-ancestors 'self'" always;
  }
}
